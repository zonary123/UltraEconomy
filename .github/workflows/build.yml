name: Build, Discord & Modrinth Release

on:
  push:
    tags: [ "*" ]

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MOD_NAME: ""
  MOD_VERSION: ""
  MINECRAFT_VERSION: ""

jobs:
  full-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set project info
        id: set-info
        run: |
          TAG="${{ github.ref_name }}"
          MOD_NAME=$(grep '^mod_name=' gradle.properties | cut -d'=' -f2)
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MINECRAFT_VERSION=$(grep '^supported_minecraft_versions=' gradle.properties | cut -d'=' -f2)
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV
          echo "MINECRAFT_VERSION=$MINECRAFT_VERSION" >> $GITHUB_ENV


      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build mod
        run: ./gradlew build remapJar --no-daemon

      - name: Extract Changelog
        id: extract-changelog
        run: |
          BASE=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tr -d '\r' < CHANGELOG.md | awk -v ver="$BASE" '
            index($0, "## [" ver "]") {flag=1; next}
            /^## \[/ {if (flag) {flag=0}}
            flag {print}
          ' > changelog_temp.md
          
          if [ ! -s changelog_temp.md ]; then
            echo "Automated release for version $TAG" > changelog_temp.md
          fi

      - name: Check if version exists on Modrinth
        id: check-version
        run: |
          EXISTS=$(curl -s "https://api.modrinth.com/v2/project/$MOD_NAME/version" | \
            jq -r ".[] | select(.version_number==\"$MOD_VERSION\") | .version_number" 2>/dev/null || true)
          
          if [ -n "$EXISTS" ]; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "La versión $MOD_VERSION ya existe en Modrinth, se omitirá la publicación."
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" build/libs/*.jar \
            --title "Release $TAG" \
            --notes-file changelog_temp.md

      - name: Send Discord Notification with Embed and File
        run: |
          FILE=$(ls build/libs/*.jar | grep -v "sources" | head -n1)
          CHANGELOG_CONTENT=$(cat changelog_temp.md)
          
          # Generar JSON embed correctamente escapado
          JSON_PAYLOAD=$(jq -nc --arg tag "$TAG" --arg changelog "$CHANGELOG_CONTENT" \
            '{content: "@everyone 🎉 New Release!", embeds:[{title:("Release "+$tag), description:$changelog, color:3066993}]}')
          
          echo "Embed JSON:"
          echo "$JSON_PAYLOAD"
          
          # 1️⃣ Enviar primero el embed
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
          
          # 2️⃣ Enviar después el archivo como segundo mensaje
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -F "file=@${FILE}"

      - name: Publish to Modrinth
        if: steps.check-version.outputs.version_exists != 'true'
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: ${{ env.MOD_NAME }}
          
          # Files to upload
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          
          # Version info
          version: ${{ env.MOD_VERSION }}
          version-title: "UltraEconomy ${{ env.MOD_VERSION }}"
          version-type: release
          
          # Environment compatibility
          loaders: fabric
          game-versions: ${{ env.MINECRAFT_VERSION }}
          
          # Changelog
          changelog-file: changelog_temp.md

      - name: Update Modrinth Description
        if: steps.check-version.outputs.version_exists != 'true'
        uses: funnyboy-roks/modrinth-auto-desc@v1.7
        with:
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ${{ env.MOD_NAME }}
          readme: README.MD

